name: Release candidate soak

on:
  workflow_dispatch:
    inputs:
      soak_duration_ms:
        description: qbxsql reconnect-soak duration in milliseconds
        required: true
        default: '3600000'
      comparison_duration_ms:
        description: Per-connector steady comparison duration in milliseconds
        required: true
        default: '600000'
      workers:
        description: Concurrent workers
        required: true
        default: '100'

permissions:
  contents: read

concurrency:
  group: qbxsql-release-soak
  cancel-in-progress: false

jobs:
  soak:
    name: Fixed-hardware qbxsql/oxmysql release gate
    runs-on: [self-hosted, Linux, X64, qbxsql-soak]
    timeout-minutes: 120
    env:
      CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
      FXSERVER_BINARY: ${{ vars.FXSERVER_LINUX_BINARY }}
      DB_CONTAINER: qbxsql-soak-${{ github.run_id }}-${{ github.run_attempt }}
      QBXSQL_TEST_CONNECTION_STRING: mysql://root:root@127.0.0.1:33077/qbxsql_soak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Record fixed runner hardware
        shell: bash
        run: |
          lscpu
          free -h
          uname -a
      - run: bun install --frozen-lockfile
      - run: bun run release
      - name: Start isolated MariaDB 11.4
        shell: bash
        run: |
          docker run --detach --rm \
            --name "$DB_CONTAINER" \
            --publish 33077:3306 \
            --env MARIADB_ROOT_PASSWORD=root \
            --env MARIADB_DATABASE=qbxsql_soak \
            mariadb:11.4
          for attempt in $(seq 1 60); do
            if docker exec "$DB_CONTAINER" mariadb-admin ping -h localhost -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run one-hour mixed-query soak with periodic database restarts
        shell: bash
        run: |
          duration='${{ inputs.soak_duration_ms }}'
          workers='${{ inputs.workers }}'
          node scripts/run-benchmark.mjs \
            --binary "$FXSERVER_BINARY" \
            --provider qbxsql \
            --duration "$duration" \
            --workers "$workers" \
            --output qbxsql-soak.json &
          benchmark_pid=$!
          (
            sleep 600
            while kill -0 "$benchmark_pid" 2>/dev/null; do
              docker restart "$DB_CONTAINER"
              sleep 600
            done
          ) &
          restart_pid=$!
          set +e
          wait "$benchmark_pid"
          status=$?
          kill "$restart_pid" 2>/dev/null || true
          wait "$restart_pid" 2>/dev/null || true
          set -e
          exit "$status"
      - name: Enforce soak reliability and memory gates
        run: >-
          node scripts/validate-soak.mjs
          --result qbxsql-soak.json
          --minimum-duration '${{ inputs.soak_duration_ms }}'
          --minimum-reconnects 1
      - name: Download the verified oxmysql 2.14.1 baseline
        shell: bash
        run: |
          mkdir -p .benchmark/oxmysql
          curl --fail --location --retry 3 \
            https://github.com/overextended/oxmysql/releases/download/v2.14.1/oxmysql.zip \
            --output .benchmark/oxmysql.zip
          unzip -q .benchmark/oxmysql.zip -d .benchmark/oxmysql
          manifest="$(find .benchmark/oxmysql -name fxmanifest.lua -print -quit)"
          test -n "$manifest"
          echo "OXMYSQL_RESOURCE=$(dirname "$manifest")" >> "$GITHUB_ENV"
      - name: Run steady qbxsql comparison workload
        run: >-
          node scripts/run-benchmark.mjs
          --binary "$FXSERVER_BINARY"
          --provider qbxsql
          --duration '${{ inputs.comparison_duration_ms }}'
          --workers '${{ inputs.workers }}'
          --output qbxsql-steady.json
      - name: Run steady oxmysql 2.14.1 comparison workload
        run: >-
          node scripts/run-benchmark.mjs
          --binary "$FXSERVER_BINARY"
          --provider oxmysql
          --oxmysql-path "$OXMYSQL_RESOURCE"
          --duration '${{ inputs.comparison_duration_ms }}'
          --workers '${{ inputs.workers }}'
          --output oxmysql-steady.json
      - name: Enforce reliability, leak, memory, median, and p95 gates
        run: >-
          node scripts/compare-benchmarks.mjs
          --qbxsql qbxsql-steady.json
          --oxmysql oxmysql-steady.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qbxsql-soak-${{ github.run_id }}
          path: |
            *-soak.json
            *-steady.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop isolated database
        if: always()
        shell: bash
        run: docker rm --force "$DB_CONTAINER" 2>/dev/null || true
