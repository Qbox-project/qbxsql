name: FXServer release gates

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-windows:
    name: Stock FXServer on Windows
    runs-on: [self-hosted, Windows, X64, qbxsql-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run release
      - name: Capture sanitized runtime evidence
        run: >-
          node scripts/write-runtime-evidence.mjs
          --binary "${{ vars.FXSERVER_WINDOWS_BINARY }}"
          --flavor stock
          --output stock-windows-runtime.json
      - name: Run stock FXServer gate
        shell: pwsh
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: |
          node scripts/run-fxserver-gate.mjs `
            --binary '${{ vars.FXSERVER_WINDOWS_BINARY }}' `
            --flavor stock 2>&1 | Tee-Object stock-windows-fxserver.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare the live API with oxmysql 2.14.1
        shell: pwsh
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'oxmysql-2.14.1.zip'
          $root = Join-Path $env:RUNNER_TEMP 'oxmysql-2.14.1'
          Invoke-WebRequest -UseBasicParsing `
            'https://github.com/overextended/oxmysql/releases/download/v2.14.1/oxmysql.zip' `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $manifest = Get-ChildItem -LiteralPath $root -Recurse -File -Filter fxmanifest.lua |
            Select-Object -First 1
          if (-not $manifest) { throw 'oxmysql archive did not contain fxmanifest.lua' }
          $oxmysql = $manifest.Directory.FullName
          node scripts/run-contract-probe.mjs `
            --binary '${{ vars.FXSERVER_WINDOWS_BINARY }}' `
            --provider qbxsql `
            --output qbxsql-contract.json
          node scripts/run-contract-probe.mjs `
            --binary '${{ vars.FXSERVER_WINDOWS_BINARY }}' `
            --provider oxmysql `
            --oxmysql-path $oxmysql `
            --output oxmysql-contract.json
          node scripts/compare-contract-probes.mjs `
            --qbxsql qbxsql-contract.json `
            --oxmysql oxmysql-contract.json
      - name: Archive Windows release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qbxsql-stock-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/
            stock-windows-runtime.json
            stock-windows-fxserver.log
            qbxsql-contract.json
            oxmysql-contract.json
          if-no-files-found: warn
          retention-days: 90

  stock-linux:
    name: Stock FXServer on Linux
    runs-on: [self-hosted, Linux, X64, qbxsql-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run release
      - name: Capture sanitized runtime evidence
        run: >-
          node scripts/write-runtime-evidence.mjs
          --binary "${{ vars.FXSERVER_LINUX_BINARY }}"
          --flavor stock
          --output stock-linux-runtime.json
      - name: Run stock FXServer gate
        shell: bash
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: |
          set -o pipefail
          node scripts/run-fxserver-gate.mjs \
            --binary '${{ vars.FXSERVER_LINUX_BINARY }}' \
            --flavor stock 2>&1 | tee stock-linux-fxserver.log
      - name: Compare the live API with oxmysql 2.14.1
        shell: bash
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: |
          archive="$RUNNER_TEMP/oxmysql-2.14.1.zip"
          root="$RUNNER_TEMP/oxmysql-2.14.1"
          curl --fail --location --retry 3 \
            https://github.com/overextended/oxmysql/releases/download/v2.14.1/oxmysql.zip \
            --output "$archive"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          manifest="$(find "$root" -name fxmanifest.lua -print -quit)"
          test -n "$manifest"
          oxmysql="$(dirname "$manifest")"
          node scripts/run-contract-probe.mjs \
            --binary '${{ vars.FXSERVER_LINUX_BINARY }}' \
            --provider qbxsql \
            --output qbxsql-contract.json
          node scripts/run-contract-probe.mjs \
            --binary '${{ vars.FXSERVER_LINUX_BINARY }}' \
            --provider oxmysql \
            --oxmysql-path "$oxmysql" \
            --output oxmysql-contract.json
          node scripts/compare-contract-probes.mjs \
            --qbxsql qbxsql-contract.json \
            --oxmysql oxmysql-contract.json
      - name: Archive Linux release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qbxsql-stock-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/
            stock-linux-runtime.json
            stock-linux-fxserver.log
            qbxsql-contract.json
            oxmysql-contract.json
          if-no-files-found: warn
          retention-days: 90

  enhanced-windows:
    name: Enhanced CFX server on Windows
    runs-on: [self-hosted, Windows, X64, qbxsql-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run release
      - name: Capture sanitized runtime evidence
        run: >-
          node scripts/write-runtime-evidence.mjs
          --binary "${{ vars.CFX_ENHANCED_WINDOWS_BINARY }}"
          --flavor enhanced
          --output enhanced-windows-runtime.json
      - name: Run enhanced CFX gate
        shell: pwsh
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: |
          node scripts/run-fxserver-gate.mjs `
            --binary '${{ vars.CFX_ENHANCED_WINDOWS_BINARY }}' `
            --flavor enhanced 2>&1 | Tee-Object enhanced-windows-fxserver.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive enhanced release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qbxsql-enhanced-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/
            enhanced-windows-runtime.json
            enhanced-windows-fxserver.log
          if-no-files-found: warn
          retention-days: 90
