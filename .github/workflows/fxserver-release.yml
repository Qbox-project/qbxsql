name: FXServer release gates

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-windows:
    name: Stock FXServer on Windows
    runs-on: [self-hosted, Windows, X64, qbxsql-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run release
      - name: Run stock FXServer gate
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: >-
          node scripts/run-fxserver-gate.mjs
          --binary "${{ vars.FXSERVER_WINDOWS_BINARY }}"
          --flavor stock

  stock-linux:
    name: Stock FXServer on Linux
    runs-on: [self-hosted, Linux, X64, qbxsql-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run release
      - name: Run stock FXServer gate
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: >-
          node scripts/run-fxserver-gate.mjs
          --binary "${{ vars.FXSERVER_LINUX_BINARY }}"
          --flavor stock

  enhanced-windows:
    name: Enhanced CFX server on Windows
    runs-on: [self-hosted, Windows, X64, qbxsql-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run release
      - name: Run enhanced CFX gate
        env:
          CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
          QBXSQL_TEST_CONNECTION_STRING: ${{ secrets.QBXSQL_TEST_CONNECTION_STRING }}
        run: >-
          node scripts/run-fxserver-gate.mjs
          --binary "${{ vars.CFX_ENHANCED_WINDOWS_BINARY }}"
          --flavor enhanced
