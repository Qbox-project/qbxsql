name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, build, and fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:contract
      - run: bun run build
      - name: Verify tracked build output
        run: git diff --exit-code -- dist
      - name: Audit production dependencies
        run: bun audit --audit-level high

  database-matrix:
    name: ${{ matrix.database.name }} integration
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MariaDB 10.11
            image: mariadb:10.11
          - name: MariaDB 11.4
            image: mariadb:11.4
          - name: MariaDB 11.8
            image: mariadb:11.8
          - name: MySQL 8.0
            image: mysql:8.0
          - name: MySQL 8.4
            image: mysql:8.4
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      QBXSQL_TEST_ADMIN_URL: mysql://root:root@127.0.0.1:${{ job.services.database.ports[3306] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  release-artifact:
    name: Deterministic release artifact
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Build twice and verify determinism
        shell: bash
        run: |
          bun run release
          first="$(cut -d ' ' -f 1 release/*.sha256)"
          bun run release
          second="$(cut -d ' ' -f 1 release/*.sha256)"
          test "$first" = "$second"
          bun run release:validate
      - uses: actions/upload-artifact@v4
        with:
          name: qbxsql-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
