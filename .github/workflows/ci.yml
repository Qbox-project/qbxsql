name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qbxsql-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, build, and MariaDB 11.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:contract
      - run: bun run build
      - name: Verify tracked build output
        run: git diff --exit-code -- dist
      - name: Run integration suite
        env:
          QBXSQL_TEST_ADMIN_URL: mysql://root:root@127.0.0.1:${{ job.services.database.ports['3306'] }}
        run: bun run test:integration
